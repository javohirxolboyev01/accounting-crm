services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buxcrm}
      POSTGRES_USER: ${POSTGRES_USER:-buxcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buxcrm_dev_password}
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    command: ["postgres", "-c", "timezone=Asia/Tashkent"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Test bazasi (buxcrm_test) birinchi ishga tushishda yaratiladi
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buxcrm} -d ${POSTGRES_DB:-buxcrm}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
